# Update pull requests for the dependencies. New versions wait a few days
# (3 for patches, 7 otherwise) before an update is proposed. Action updates
# also update .github/workflows/actions.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 3
