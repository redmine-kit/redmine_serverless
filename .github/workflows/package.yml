# Publishes the plugin's run-time files (package/Dockerfile) to
# ghcr.io/redmine-kit/redmine_serverless, tagged sha-<commit> and main
# (or the version tag). Serverless takes it by digest.
name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        run: |
          image=ghcr.io/redmine-kit/redmine_serverless
          echo "tags=$image:sha-${GITHUB_SHA::12},$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: package/Dockerfile
          # Only files; arm64, which the image that copies them is built for.
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - run: echo "Pushed ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
