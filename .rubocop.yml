AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Include:
    - '**/*.rb'
    - '**/*.rake'
    - '**/Gemfile'
    - 'Gemfile.lint'

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Layout/LineLength:
  Max: 120
